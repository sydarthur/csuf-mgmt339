<style>

  --navy:#002E5B; --orange:#C85F00; --orange-soft:#FDF0E3; --green:#1E7A3C; --purple:#6A3D9A; --red:#B42318;

html,body{height:100%}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.5;display:flex;flex-direction:column}

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=(x,d=0)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const $$=(n)=>'$'+fmt(Math.round(n));
// ---------- shared examples (match the lecture slides) ----------
const EX={D:10800,C:160,i:0.25,S:250,days:360,L:6};      // EOQ example: H = $40, EOQ = 367, R = 180
const RX={d:30,sd:5,L:4,sl:95,P:12};                      // Valley Pharmacy: SS = 17, R = 137; P system T = 513
const Z={80:0.84,85:1.04,90:1.28,95:1.65,97.5:1.96,99:2.33,99.9:3.09};
const SLS=[80,85,90,95,97.5,99,99.9];

// ---------- tiny SVG helpers ----------
function svg(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`}
function axes(x0,y0,x1,y1,xl,yl){return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#9AA4B2"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="#9AA4B2"/>`+
  `<text x="${(x0+x1)/2}" y="${y0+34}" text-anchor="middle" font-size="14" fill="#5A6472">${xl}</text>`+
  `<text x="${x0-44}" y="${(y0+y1)/2}" text-anchor="middle" font-size="14" fill="#5A6472" transform="rotate(-90 ${x0-44} ${(y0+y1)/2})">${yl}</text>`}
function poly(pts,col,w=3,dash=''){return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`}
function tick(x,y,t,anchor='middle'){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="13" fill="#5A6472">${t}</text>`}

// Sawtooth: inventory over one year for order size Q (optional reorder line R)
function sawtooth(Q,{D=EX.D,R=null,maxQ=1200,showAvg=true,days=EX.days,L=null}={}){
  const W=640,H=300,x0=70,y0=250,x1=620,y1=30;
  const sx=t=>x0+(x1-x0)*t/days, sy=v=>y0-(y0-y1)*v/maxQ;
  const cyc=Q/(D/EX.days); let pts=[], t=0, shade='';
  while(t<days-1e-9){const te=Math.min(days,t+cyc); const vEnd=Q-(Q*(te-t)/cyc);
    pts.push([sx(t),sy(Q)],[sx(te),sy(Math.max(0,vEnd))]);
    if(L!==null&&R!==null){const tr=t+cyc*(1-R/Q); if(tr<days) shade+=`<rect x="${sx(tr)}" y="${y1}" width="${Math.max(0,sx(Math.min(days,tr+L))-sx(tr))}" height="${y0-y1}" fill="#FDF0E3"/>`;}
    t=te;}
  let g=axes(x0,y0,x1,y1,days>100?'Days in the year':'Days','Units on hand')+shade;
  (days>100?[0,90,180,270,360]:[0,15,30,45,60]).forEach(d=>g+=tick(sx(d),y0+18,d));
  [0,maxQ/2,maxQ].forEach(v=>g+=tick(x0-8,sy(v)+4,fmt(v),'end'));
  g+=poly(pts,'#002E5B',2.5);
  if(showAvg) g+=`<line x1="${x0}" y1="${sy(Q/2)}" x2="${x1}" y2="${sy(Q/2)}" stroke="#C85F00" stroke-width="2.5" stroke-dasharray="8 6"/><text x="${x1}" y="${sy(Q/2)-8}" text-anchor="end" font-size="15" font-weight="700" fill="#C85F00">average = Q/2 = ${fmt(Q/2)}</text>`;
  if(R!==null) g+=`<line x1="${x0}" y1="${sy(R)}" x2="${x1}" y2="${sy(R)}" stroke="#B42318" stroke-width="2.5" stroke-dasharray="4 4"/><text x="${x0+8}" y="${sy(R)-8}" font-size="15" font-weight="700" fill="#B42318">reorder point R = ${fmt(R)}</text>`;
  return svg(W,H+20,g);
}
function costs(Q,{D=EX.D,S=EX.S,H=EX.C*EX.i}={}){const c=Q/2*H,o=D/Q*S;return{c,o,t:c+o}}
function eoq(D,S,H){return Math.sqrt(2*D*S/H)}
function uCurve(Q,{D=EX.D,S=EX.S,H=EX.C*EX.i,maxQ=1200}={}){
  const W=640,H2=320,x0=80,y0=270,x1=620,y1=24, maxC=32000;
  const sx=q=>x0+(x1-x0)*q/maxQ, sy=v=>y0-(y0-y1)*Math.min(v,maxC)/maxC;
  const qs=[];for(let q=60;q<=maxQ;q+=10)qs.push(q);
  let g=axes(x0,y0,x1,y1,'Order size (Q)','Annual cost');
  [0,300,600,900,1200].forEach(q=>g+=tick(sx(q),y0+18,fmt(q)));
  [0,10000,20000,30000].forEach(v=>g+=tick(x0-8,sy(v)+4,'$'+fmt(v/1000)+'k','end'));
  g+=poly(qs.map(q=>[sx(q),sy(q/2*H)]),'#002E5B',3)+poly(qs.map(q=>[sx(q),sy(D/q*S)]),'#C85F00',3)+poly(qs.map(q=>[sx(q),sy(q/2*H+D/q*S)]),'#1E7A3C',4);
  const e=eoq(D,S,H); const ce=costs(e,{D,S,H});
  g+=`<line x1="${sx(e)}" y1="${y0}" x2="${sx(e)}" y2="${sy(ce.t)}" stroke="#1E7A3C" stroke-dasharray="4 4"/><circle cx="${sx(e)}" cy="${sy(ce.t)}" r="6" fill="#1E7A3C"/><text x="${sx(e)+8}" y="${sy(ce.t)+24}" font-size="14" fill="#1E7A3C" font-weight="700">EOQ ≈ ${fmt(e)}</text>`;
  const c=costs(Q,{D,S,H});
  g+=`<line x1="${sx(Q)}" y1="${y0}" x2="${sx(Q)}" y2="${y1}" stroke="#B42318" stroke-width="2"/><circle cx="${sx(Q)}" cy="${sy(c.t)}" r="7" fill="#fff" stroke="#B42318" stroke-width="3"/>`;
  g+=`<text x="${x1}" y="${y1+12}" text-anchor="end" font-size="14"><tspan fill="#002E5B" font-weight="700">— Carrying  </tspan><tspan fill="#C85F00" font-weight="700">— Ordering  </tspan><tspan fill="#1E7A3C" font-weight="700">— Total</tspan></text>`;
  return svg(W,H2+20,g);
}
function normalChart(mean,sd,z){
  const W=640,H=280,x0=40,y0=230,x1=620,y1=30; const lo=mean-4*sd, hi=mean+4*sd;
  const sx=x=>x0+(x1-x0)*(x-lo)/(hi-lo); const pdf=x=>Math.exp(-0.5*((x-mean)/sd)**2); const sy=v=>y0-(y0-y1)*v;
  const R=mean+z*sd; let pts=[],tail=[[sx(R),y0]];
  for(let i=0;i<=200;i++){const x=lo+(hi-lo)*i/200; pts.push([sx(x),sy(pdf(x))]); if(x>=R) tail.push([sx(x),sy(pdf(x))]);}
  tail.push([sx(hi),y0]);
  let g=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#9AA4B2"/>`;
  g+=`<polygon points="${tail.map(p=>p.join(',')).join(' ')}" fill="#F7C9C3"/>`;
  g+=poly(pts,'#002E5B',3);
  g+=`<line x1="${sx(mean)}" y1="${y0}" x2="${sx(mean)}" y2="${y1}" stroke="#002E5B" stroke-dasharray="4 4"/><text x="${sx(mean)}" y="${y0+22}" text-anchor="middle" font-size="14" fill="#002E5B">average ${fmt(mean)}</text>`;
  g+=`<line x1="${sx(R)}" y1="${y0}" x2="${sx(R)}" y2="${y1}" stroke="#B42318" stroke-width="3"/><text x="${sx(R)}" y="${y1-6}" text-anchor="middle" font-size="15" font-weight="700" fill="#B42318">R = ${fmt(Math.ceil(R-1e-9))}</text>`;
  g+=`<text x="${(sx(R)+x1)/2}" y="${y0-12}" text-anchor="middle" font-size="13" fill="#B42318">stockout risk</text>`;
  g+=`<text x="${x0}" y="${y0+44}" font-size="14" fill="#5A6472">Demand during the delivery wait</text>`;
  return svg(W,H+30,g);
}
function bars(items,maxV,unit=''){
  const W=640,H=260,x0=40,y0=210,x1=620,y1=30; const bw=(x1-x0)/items.length;
  let g=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#9AA4B2"/>`;
  items.forEach((it,i)=>{const h=(y0-y1)*it.v/maxV, x=x0+i*bw+bw*0.18, w=bw*0.64;
    g+=`<rect x="${x}" y="${y0-h}" width="${w}" height="${h}" rx="4" fill="${it.hl?'#C85F00':'#9FB3C8'}"/><text x="${x+w/2}" y="${y0-h-8}" text-anchor="middle" font-size="15" font-weight="700" fill="${it.hl?'#C85F00':'#1B2430'}">${fmt(it.v,1)}${unit}</text><text x="${x+w/2}" y="${y0+22}" text-anchor="middle" font-size="14" fill="#5A6472">${it.label}</text>`;});
  return svg(W,H,g);
}
// P system sawtooth with variable demand (seeded so it's the same every time)
function pSaw(P,L,T,{d=RX.d,days=60}={}){
  const W=640,H=300,x0=70,y0=250,x1=620,y1=30,maxV=Math.max(600,T*1.15);
  const sx=t=>x0+(x1-x0)*t/days, sy=v=>y0-(y0-y1)*Math.max(0,v)/maxV;
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  let inv=T-d*L, pts=[[sx(0),sy(inv)]], orders=[], g='';
  const pending=[];
  for(let day=0;day<days;day++){
    if(day%P===0){const q=Math.round(T-(inv+pending.reduce((a,o)=>a+o.q,0))); if(q>0){pending.push({q,arr:day+L}); orders.push({day,q});}}
    const use=d*(0.6+0.8*rnd()); inv-=use; pts.push([sx(day+1),sy(inv)]);
    for(let k=pending.length-1;k>=0;k--) if(pending[k].arr===day+1){inv+=pending[k].q; pts.push([sx(day+1),sy(inv)]); pending.splice(k,1);}
  }
  g+=axes(x0,y0,x1,y1,'Days','Units on hand');
  [0,20,40,60].forEach(t=>g+=tick(sx(t),y0+18,t));
  g+=`<line x1="${x0}" y1="${sy(T)}" x2="${x1}" y2="${sy(T)}" stroke="#C85F00" stroke-width="2.5" stroke-dasharray="8 6"/><text x="${x1}" y="${sy(T)-8}" text-anchor="end" font-size="15" font-weight="700" fill="#C85F00">target T = ${fmt(T)}</text>`;
  orders.forEach((o,k)=>{g+=`<line x1="${sx(o.day)}" y1="${y0}" x2="${sx(o.day)}" y2="${y1+30}" stroke="#9AA4B2" stroke-dasharray="3 4"/><text x="${sx(o.day)+4}" y="${y1+44+(k%2)*16}" font-size="13" fill="#5A6472">order ${fmt(o.q)}</text>`;});
  g+=`<text x="${x0+6}" y="${y0-8}" font-size="13" fill="#5A6472">dashed lines = review days</text>`;
  g+=poly(pts,'#002E5B',2.5);
  return svg(W,H+20,g);
}

// ---------- slides ----------
const PARTS=['Start','Costs','EOQ','Q system','P system','Summary'];
const slides=[
{part:0,html:()=>`<div class="kicker">MGMT 339 · Inventory management</div><h2>How much to order, and when?</h2>
<p class="lead">Every inventory manager answers two questions. This guide walks through them one step at a time, using the same examples as the lecture slides.</p>
<div class="cols"><div class="box"><b>How much?</b><br>Balance the cost of <b>holding</b> stock against the cost of <b>ordering</b> it → the Economic Order Quantity (EOQ).</div>
<div class="box"><b>When?</b><br>Reorder when what's left will last exactly as long as the delivery takes, plus a cushion for bad days → reorder point and safety stock (Q system), or a fixed review schedule (P system).</div></div>
<p class="anchor">Too little and you lose the sale. Too much and you lose the money.</p>`},
{part:1,html:()=>`<div class="kicker">Costs · 1 of 3</div><h2>Two costs pull against each other</h2>
<div class="cols"><div class="box"><b>Order a lot at once</b><ul class="clean"><li>Few orders, so low ordering cost</li><li>But lots of stock sitting on the shelf → high <b>carrying cost</b></li></ul></div>
<div class="box"><b>Order a little at a time</b><ul class="clean"><li>Little stock on the shelf → low carrying cost</li><li>But you're ordering constantly → high <b>ordering cost</b></li></ul></div></div>
<p class="lead" style="margin-top:16px">Running example (same as the slides): demand <b>D = 10,800 units/yr</b>, unit cost <b>$160</b>, holding <b>25%</b> per year, ordering cost <b>S = $250</b> per order.</p>
<p class="anchor">The EOQ is the order size where these two costs balance.</p>`},
{part:1,html:()=>`<div class="kicker">Costs · 2 of 3</div><h2>Carrying cost: the price of having stock</h2>
<div class="cols wide-right"><div><div class="formula">Carrying cost/yr = <span class="t1">Q/2</span> × <span class="t3">H</span></div>
<ul class="clean"><li><b>H</b> = holding % × unit cost = 25% × $160 = <b>$40</b> per unit per year (cash tied up, storage, insurance, spoilage).</li>
<li><b>Q/2</b>: you receive Q, use it steadily down to zero, then receive Q again. On average, half of Q is on the shelf.</li></ul>
<div class="ctrl"><label>Order size Q</label><input type="range" id="q1" min="60" max="1200" step="10" value="600"><output id="q1o"></output></div>
<div class="read"><div><span>Average inventory</span><strong id="r1a"></strong></div><div class="hl"><span>Carrying cost / yr</span><strong id="r1b"></strong></div></div></div>
<div id="c1"></div></div>
<p class="anchor">Inventory is cash sitting on a shelf.</p>`,
 init:()=>{const f=()=>{const Q=+$('#q1').value;$('#q1o').textContent=fmt(Q);$('#r1a').textContent=fmt(Q/2);$('#r1b').textContent=$$(Q/2*40);$('#c1').innerHTML=sawtooth(Q)};$('#q1').oninput=f;f();}},
{part:1,html:()=>`<div class="kicker">Costs · 3 of 3</div><h2>Ordering cost: the price of getting stock</h2>
<div class="cols wide-right"><div><div class="formula">Ordering cost/yr = <span class="t1">D/Q</span> × <span class="t3">S</span></div>
<ul class="clean"><li><b>D/Q</b> = how many orders a year. Count the teeth on the sawtooth.</li>
<li><b>S</b> = $250 per order: paperwork, delivery scheduling, receiving, paying the invoice. Same cost for a small order or a big one.</li></ul>
<div class="ctrl"><label>Order size Q</label><input type="range" id="q2" min="60" max="1200" step="10" value="600"><output id="q2o"></output></div>
<div class="read"><div><span>Orders / yr</span><strong id="r2a"></strong></div><div class="hl"><span>Ordering cost / yr</span><strong id="r2b"></strong></div></div></div>
<div id="c2"></div></div>
<p class="anchor">Order more at a time, and you place fewer orders.</p>`,
 init:()=>{const f=()=>{const Q=+$('#q2').value;$('#q2o').textContent=fmt(Q);$('#r2a').textContent=fmt(EX.D/Q,1);$('#r2b').textContent=$$(EX.D/Q*250);$('#c2').innerHTML=sawtooth(Q,{showAvg:false})};$('#q2').oninput=f;f();}},
{part:2,html:()=>`<div class="kicker">EOQ · 1 of 3</div><h2>Find the bottom of the U</h2>
<div class="cols wide-right"><div><p>Slide Q and watch the two costs move in opposite directions. The <b style="color:var(--green)">total</b> is lowest where they cross.</p>
<div class="ctrl"><label>Order size Q</label><input type="range" id="q3" min="60" max="1200" step="1" value="200"><output id="q3o"></output></div>
<div class="read"><div><span>Carrying</span><strong id="r3a"></strong></div><div><span>Ordering</span><strong id="r3b"></strong></div><div class="hl"><span>Total</span><strong id="r3c"></strong></div></div>
<p class="note" id="r3m" style="margin-top:10px"></p></div>
<div id="c3"></div></div>
<p class="anchor">At the EOQ, the two costs are equal. That's the bottom of the U.</p>`,
 init:()=>{const f=()=>{const Q=+$('#q3').value,c=costs(Q);$('#q3o').textContent=fmt(Q);$('#r3a').textContent=$$(c.c);$('#r3b').textContent=$$(c.o);$('#r3c').textContent=$$(c.t);
  $('#r3m').textContent=Math.abs(c.c-c.o)<300?'Here the two costs are (almost) equal: you\'re at the EOQ.':(c.o>c.c?'Ordering cost is bigger: try a larger Q.':'Carrying cost is bigger: try a smaller Q.');$('#c3').innerHTML=uCurve(Q)};$('#q3').oninput=f;f();}},
{part:2,html:()=>`<div class="kicker">EOQ · 2 of 3</div><h2>The EOQ formula, step by step</h2>
<div class="formula">EOQ = √( 2 × <span class="t1">D</span> × <span class="t3">S</span> ÷ <span class="t2">H</span> )</div>
<div class="steps" id="st5">
<div class="st"><span class="n" style="color:var(--green)">Step 1</span><span>Holding cost per unit: <b style="color:var(--green)">H = 25% × $160 = $40</b></span></div>
<div class="st"><span class="n" style="color:var(--navy)">Step 2</span><span>Top of the fraction: 2 × <b>10,800</b> × <b style="color:var(--orange)">$250</b> = <b>5,400,000</b></span></div>
<div class="st"><span class="n" style="color:var(--navy)">Step 3</span><span>Divide by H: 5,400,000 ÷ <b style="color:var(--green)">40</b> = <b>135,000</b></span></div>
<div class="st"><span class="n" style="color:var(--orange)">Step 4</span><span>Square root: √135,000 ≈ <b style="color:var(--orange)">367 units</b> per order</span></div>
<div class="st"><span class="n" style="color:var(--red)">Check</span><span>Carrying = 367/2 × $40 ≈ <b>$7,348</b> · Ordering = 10,800/367 × $250 ≈ <b>$7,348</b> · Total ≈ <b>$14,697</b></span></div>
</div><p class="reveal-hint">Press Next to reveal each step.</p>
<p class="note" style="margin-top:8px">Common slips: forgetting the 2 (gives 260), or using the $160 unit cost instead of H = $40 (gives 184).</p>`,
 steps:5},
{part:2,html:()=>`<div class="kicker">EOQ · 3 of 3</div><h2>Try it: what moves the EOQ?</h2>
<div class="cols wide-right"><div>
<div class="ctrl"><label>Demand D / yr</label><input type="range" id="d4" min="2000" max="20000" step="100" value="10800"><output id="d4o"></output></div>
<div class="ctrl"><label>Order cost S</label><input type="range" id="s4" min="25" max="600" step="5" value="250"><output id="s4o"></output></div>
<div class="ctrl"><label>Holding cost H</label><input type="range" id="h4" min="5" max="100" step="1" value="40"><output id="h4o"></output></div>
<div class="read"><div class="hl"><span>EOQ</span><strong id="r4a"></strong></div><div><span>Total cost at EOQ</span><strong id="r4b"></strong></div><div><span>Orders / yr</span><strong id="r4c"></strong></div></div>
<ul class="clean" style="margin-top:12px"><li><b>S up</b> → orders are expensive → order bigger, less often.</li><li><b>H up</b> → holding is expensive → order smaller, more often.</li><li><b>Flat bottom:</b> being 20% off the EOQ raises total cost by only about 2%, so rough inputs still work.</li></ul></div>
<div id="c4"></div></div>`,
 init:()=>{const f=()=>{const D=+$('#d4').value,S=+$('#s4').value,H=+$('#h4').value,e=eoq(D,S,H),c=costs(e,{D,S,H});
  $('#d4o').textContent=fmt(D);$('#s4o').textContent='$'+S;$('#h4o').textContent='$'+H;$('#r4a').textContent=fmt(e);$('#r4b').textContent=$$(c.t);$('#r4c').textContent=fmt(D/e,1);
  $('#c4').innerHTML=uCurve(Math.min(1200,e),{D,S,H})};['#d4','#s4','#h4'].forEach(k=>$(k).oninput=f);f();}},
{part:3,html:()=>`<div class="kicker">Q system · 1 of 5</div><h2>When to order: the reorder point</h2>
<div class="cols wide-right"><div><p>In a <b>continuous review (Q) system</b>, you watch stock all the time. When it drops to the <b style="color:var(--red)">reorder point R</b>, you order the same Q (the EOQ) every time.</p>
<div class="formula">R = <span class="t1">d</span> × <span class="t3">L</span></div>
<ul class="clean"><li><b>d</b> = daily demand = 10,800 ÷ 360 = 30 units/day</li><li><b>L</b> = lead time (delivery wait)</li></ul>
<div class="ctrl"><label>Lead time L (days)</label><input type="range" id="l5" min="1" max="12" step="1" value="6"><output id="l5o"></output></div>
<div class="read"><div class="hl"><span>Reorder point R</span><strong id="r5a"></strong></div></div>
<p class="note" style="margin-top:8px">The shaded strips are the delivery waits: the order goes in at R and arrives just as stock hits zero.</p></div>
<div id="c5"></div></div>
<p class="anchor">Reorder when what's left will last exactly as long as the delivery takes.</p>`,
 init:()=>{const f=()=>{const L=+$('#l5').value,R=30*L;$('#l5o').textContent=L;$('#r5a').textContent=fmt(R)+' units';$('#c5').innerHTML=sawtooth(367,{R,L,showAvg:false,maxQ:400,days:60})};$('#l5').oninput=f;f();}},
{part:3,html:()=>`<div class="kicker">Q system · 2 of 5</div><h2>What if demand varies?</h2>
<p class="lead">Coffee pods: you reorder at <b>6</b>, and shipping takes <b>3 days</b>.</p>
<table class="t" style="max-width:860px"><tr><th></th><th>Day 1</th><th>Day 2</th><th>Day 3</th><th>When the box arrives</th></tr>
<tr><td><b>Normal week</b> (2 a day)</td><td>6 → 4</td><td>4 → 2</td><td>2 → 0</td><td>Just in time</td></tr>
<tr class="hl"><td>Busy week (friends over)</td><td>6 → 4</td><td>4 → 1</td><td>1 → out</td><td>Out of coffee on Day 3</td></tr></table>
<div class="box warm" style="margin-top:18px"><b>When demand varies, how do you protect yourself?</b><br>Keep a cushion: <b style="color:var(--orange)">safety stock</b>. &nbsp; R = average demand during the delivery wait + safety stock.</div>
<p class="anchor">Safety stock is the cushion for the days that go worse than average.</p>`},
{part:3,html:()=>`<div class="kicker">Q system · 3 of 5</div><h2>Safety stock, step by step</h2>
<p class="lead">Valley Pharmacy sells <b>30</b> boxes of allergy medicine a day on average (σ = <b>5</b>/day). Delivery takes <b>4 days</b>. Target: <b>95%</b> service level (z = 1.65).</p>
<div class="formula">R = <span class="t1">d̄ × L</span> + <span class="t3">z</span> × <span class="t2">σ<sub>dLT</sub></span></div>
<div class="steps" id="st8">
<div class="st"><span class="n" style="color:var(--navy)">Step 1</span><span>Average demand during the wait: <b>30 × 4 = 120</b></span></div>
<div class="st"><span class="n" style="color:var(--green)">Step 2</span><span>Spread during the wait: σ<sub>dLT</sub> = 5 × √4 = <b style="color:var(--green)">10</b></span></div>
<div class="st"><span class="n" style="color:var(--orange)">Step 3</span><span>Safety stock: 1.65 × 10 = 16.5 → <b style="color:var(--orange)">17</b> (round up)</span></div>
<div class="st"><span class="n" style="color:var(--red)">Step 4</span><span>Reorder point: R = 120 + 17 = <b style="color:var(--red)">137 boxes</b></span></div>
</div><p class="reveal-hint">Press Next to reveal each step.</p>
<p class="note">Why √L? Busy days and slow days partly cancel out, so the spread grows more slowly than the wait.</p>
<p class="anchor">120 covers a normal wait. 17 covers a bad one.</p>`,steps:4},
{part:3,html:()=>`<div class="kicker">Q system · 4 of 5</div><h2>Play with the cushion</h2>
<div class="cols wide-right"><div><p>Valley Pharmacy again (30 a day, 4-day delivery). Change how unpredictable demand is, and how much protection you want.</p>
<div class="ctrl"><label>Demand spread σ (per day)</label><input type="range" id="sd9" min="0" max="15" step="1" value="5"><output id="sd9o"></output></div>
<div class="ctrl"><label>Service level</label><input type="range" id="sl9" min="0" max="6" step="1" value="3"><output id="sl9o"></output></div>
<div class="read"><div><span>Spread during wait σ<sub>dLT</sub></span><strong id="r9a"></strong></div><div class="hl"><span>Safety stock</span><strong id="r9b"></strong></div><div><span>Reorder point R</span><strong id="r9c"></strong></div><div><span>Stockouts</span><strong id="r9d"></strong></div></div></div>
<div><div id="c9"></div><div id="b9"></div></div></div>
<p class="anchor">Each extra percent of protection costs more cushion than the last.</p>`,
 init:()=>{const f=()=>{const sd=+$('#sd9').value, sl=SLS[+$('#sl9').value], z=Z[sl], s=sd*2, ss=Math.ceil(z*s-1e-9);
  $('#sd9o').textContent=sd;$('#sl9o').textContent=sl+'%';$('#r9a').textContent=fmt(s);$('#r9b').textContent=fmt(ss);$('#r9c').textContent=fmt(120+ss);
  $('#r9d').textContent='1 in '+fmt(Math.round(100/(100-sl)));
  $('#c9').innerHTML=sd>0?normalChart(120,s,z):'<p class="box" style="margin-top:40px">No uncertainty: demand is exactly 120 during every wait, so no safety stock is needed. R = 120.</p>';
  $('#b9').innerHTML=sd>0?'<p class="note" style="text-align:center">Safety stock needed at each service level</p>'+bars(SLS.map(v=>({label:v+'%',v:Z[v]*s,hl:v===sl})),Math.max(1,Z[99.9]*s)*1.15):'';};
  ['#sd9','#sl9'].forEach(k=>$(k).oninput=f);f();}},
{part:3,html:()=>`<div class="kicker">Q system · 5 of 5</div><h2>When the delivery time varies too</h2>
<div class="cols wide-right"><div><p>Same pharmacy (30 a day, σ<sub>d</sub> = 5, 4-day average delivery, 95%). Now the supplier is unreliable: delivery time varies by σ<sub>L</sub> days.</p>
<div class="formula" style="font-size:22px">σ<sub>dLT</sub> = √( <span class="t2">L̄ × σ<sub>d</sub>²</span> + <span class="t4">d̄² × σ<sub>L</sub>²</span> )</div>
<div class="ctrl"><label>Delivery spread σ<sub>L</sub> (days)</label><input type="range" id="sl10" min="0" max="2" step="0.1" value="0.8"><output id="sl10o"></output></div>
<div class="read"><div><span>From demand</span><strong id="r10a" style="color:var(--green)"></strong></div><div><span>From the supplier</span><strong id="r10b" style="color:var(--purple)"></strong></div><div><span>σ<sub>dLT</sub></span><strong id="r10c"></strong></div><div class="hl"><span>Safety stock</span><strong id="r10d"></strong></div></div>
<p class="note" style="margin-top:8px">At σ<sub>L</sub> = 0.8: 100 + 576 = 676 → √676 = 26 → safety stock 43, R = 163 (vs. 17 and 137 with a reliable supplier).</p></div>
<div id="c10"></div></div>
<p class="anchor">An unreliable supplier costs you inventory.</p>`,
 init:()=>{const f=()=>{const sL=+$('#sl10').value, a=4*25, b=900*sL*sL, s=Math.sqrt(a+b), ss=Math.ceil(1.65*s-1e-9);
  $('#sl10o').textContent=sL.toFixed(1);$('#r10a').textContent=fmt(a);$('#r10b').textContent=fmt(b);$('#r10c').textContent=fmt(s,1);$('#r10d').textContent=fmt(ss);
  $('#c10').innerHTML=bars([{label:'Reliable supplier',v:17},{label:'This supplier',v:ss,hl:true}],Math.max(60,ss*1.2));};$('#sl10').oninput=f;f();}},
{part:4,html:()=>`<div class="kicker">P system · 1 of 3</div><h2>Periodic review: check on a schedule</h2>
<div class="cols"><div class="box"><b>Q system</b> (continuous)<ul class="clean"><li>Watch stock all the time</li><li>Order the <b>same amount</b> whenever stock hits R</li><li>Time between orders varies</li></ul></div>
<div class="box warm"><b>P system</b> (periodic)<ul class="clean"><li>Check stock every <b>P</b> days, no matter what</li><li>Order enough to bring stock <b>up to a target T</b></li><li>Order size varies; timing is fixed</li></ul></div></div>
<p class="lead" style="margin-top:16px">Coffee pods, P-system style: you check the drawer <b>every Sunday</b>, shipping takes 3 days, and you drink 2 a day. Your stock must last until the <i>next</i> order arrives: 7 + 3 = <b>10 days</b> → target 20 pods. Busy week, 6 left → order 14. Slow week, 14 left → order 6.</p>
<p class="anchor">The order size changes every time. The target stays the same.</p>`},
{part:4,html:()=>`<div class="kicker">P system · 2 of 3</div><h2>Target level, step by step</h2>
<p class="lead">Valley Pharmacy now checks stock every <b>12 days</b> (P). Delivery: <b>4 days</b> (L). Same demand: 30 a day, σ = 5, 95% (z = 1.65).</p>
<div class="formula">T = <span class="t1">d̄ × (P + L)</span> + <span class="t3">z × σ<sub>P+L</sub></span> &nbsp;&nbsp; Order = T − IP</div>
<div class="steps" id="st12">
<div class="st"><span class="n" style="color:var(--muted)">Step 1</span><span>Protection interval (how long stock must last): P + L = 12 + 4 = <b>16 days</b></span></div>
<div class="st"><span class="n" style="color:var(--navy)">Step 2</span><span>Average demand over it: 30 × 16 = <b>480</b></span></div>
<div class="st"><span class="n" style="color:var(--green)">Step 3</span><span>Spread over it: σ<sub>P+L</sub> = 5 × √16 = <b style="color:var(--green)">20</b></span></div>
<div class="st"><span class="n" style="color:var(--orange)">Step 4</span><span>Safety stock 1.65 × 20 = 33 → target <b style="color:var(--orange)">T = 480 + 33 = 513</b></span></div>
<div class="st"><span class="n" style="color:var(--red)">Step 5</span><span>Review day with 200 on hand (IP): order <b style="color:var(--red)">513 − 200 = 313</b></span></div>
</div><p class="reveal-hint">Press Next to reveal each step.</p>`,steps:5},
{part:4,html:()=>`<div class="kicker">P system · 3 of 3</div><h2>Watch the P system run</h2>
<div class="cols wide-right"><div><p>Demand bounces around 30 a day. Every review, the pharmacy orders whatever it takes to get back up to T. Change the review period.</p>
<div class="ctrl"><label>Review period P (days)</label><input type="range" id="p13" min="4" max="20" step="1" value="12"><output id="p13o"></output></div>
<div class="read"><div><span>Protection interval</span><strong id="r13a"></strong></div><div class="hl"><span>Safety stock</span><strong id="r13b"></strong></div><div><span>Target T</span><strong id="r13c"></strong></div></div>
<p class="note" style="margin-top:8px">Compare: the Q system needed only 17 boxes of safety stock for the same medicine.</p></div>
<div id="c13"></div></div>
<p class="anchor">The P system has to survive the review period too, so it needs a bigger cushion.</p>`,
 init:()=>{const f=()=>{const P=+$('#p13').value, pl=P+4, s=5*Math.sqrt(pl), ss=Math.ceil(1.65*s-1e-9), T=30*pl+ss;
  $('#p13o').textContent=P;$('#r13a').textContent=pl+' days';$('#r13b').textContent=fmt(ss);$('#r13c').textContent=fmt(T);$('#c13').innerHTML=pSaw(P,4,T)};$('#p13').oninput=f;f();}},
{part:5,html:()=>`<div class="kicker">Summary · 1 of 2</div><h2>Q vs. P: same item, different cushion</h2>
<table class="t"><tr><th></th><th>Q system (continuous)</th><th>P system (periodic)</th></tr>
<tr><td><b>When you order</b></td><td>When stock hits R (137)</td><td>Every 12 days</td></tr>
<tr><td><b>How much</b></td><td>Fixed Q (often the EOQ)</td><td>Varies: T − IP</td></tr>
<tr><td><b>Cushion must cover</b></td><td>The delivery wait: 4 days</td><td>Review + delivery: 16 days</td></tr>
<tr class="hl"><td>Safety stock (Valley Pharmacy)</td><td>17 boxes</td><td>33 boxes</td></tr>
<tr><td><b>Best for</b></td><td>High-value, critical items</td><td>Many low-value items; one supplier, one order</td></tr></table>
<p class="anchor">Same medicine, same demand, same 95%. The P system needs the bigger cushion.</p>`},
{part:5,html:()=>`<div class="kicker">Summary · 2 of 2</div><h2>All the formulas in one place</h2>
<div class="cols"><div class="box"><b>Costs and EOQ</b><ul class="clean">
<li>H = holding % × unit cost</li><li>Carrying cost/yr = (Q/2) × H</li><li>Ordering cost/yr = (D/Q) × S</li><li>Total cost = (Q/2)H + (D/Q)S</li><li>EOQ = √(2DS ÷ H)</li></ul></div>
<div class="box"><b>Q system</b><ul class="clean"><li>R = d × L (no uncertainty)</li><li>σ<sub>dLT</sub> = σ<sub>d</sub> × √L</li><li>Safety stock = z × σ<sub>dLT</sub></li><li>R = d̄ × L + safety stock</li><li>Lead time varies too: σ<sub>dLT</sub> = √(L̄σ<sub>d</sub>² + d̄²σ<sub>L</sub>²)</li></ul>
<b style="display:block;margin-top:10px">P system</b><ul class="clean"><li>σ<sub>P+L</sub> = σ<sub>d</sub> × √(P + L)</li><li>T = d̄(P + L) + z × σ<sub>P+L</sub></li><li>Order = T − IP</li></ul></div></div>
<p class="note" style="margin-top:12px">z values: 90% → 1.28 · 95% → 1.65 · 99% → 2.33</p>`}
];

// ---------- engine ----------
let cur=0, sub=0;
const partsNav=$('#parts');
PARTS.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{cur=slides.findIndex(s=>s.part===i);sub=0;render()};partsNav.appendChild(b)});
function render(){
  const s=slides[cur]; $('#slide').innerHTML=s.html(); if(s.init) s.init();
  if(s.steps){document.querySelectorAll('.steps .st').forEach((el,i)=>el.classList.toggle('show',i<sub));}
  $('#counter').textContent=(cur+1)+' / '+slides.length;
  $('#bar').style.width=((cur+1)/slides.length*100)+'%';
  [...partsNav.children].forEach((b,i)=>b.classList.toggle('on',i===s.part));
  $('#prev').disabled=cur===0&&sub===0; $('#next').disabled=cur===slides.length-1&&(!s.steps||sub>=s.steps);
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
}
function next(){const s=slides[cur]; if(s.steps&&sub<s.steps){sub++;document.querySelectorAll('.steps .st').forEach((el,i)=>el.classList.toggle('show',i<sub));$('#next').disabled=cur===slides.length-1&&sub>=s.steps;$('#prev').disabled=false;return}
  if(cur<slides.length-1){cur++;sub=0;render();window.scrollTo(0,0)}}
function prev(){const s=slides[cur]; if(s.steps&&sub>0){sub--;document.querySelectorAll('.steps .st').forEach((el,i)=>el.classList.toggle('show',i<sub));$('#prev').disabled=cur===0&&sub===0;$('#next').disabled=false;return}
  if(cur>0){cur--;const p=slides[cur];sub=p.steps||0;render();window.scrollTo(0,0)}}
$('#next').onclick=next; $('#prev').onclick=prev;
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return; if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()} if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}});
const h=parseInt((location.hash||'').slice(1)); if(h>=1&&h<=slides.length) cur=h-1;
render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SunCrest Bakery VSM</title>
<meta name="description" content="Step-by-step walkthrough for reading a value stream map: information flow, material flow, data boxes, takt time, WIP to days, lead time, and process cycle efficiency.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4;
    --card: #ffffff;
    --ink: #2c2416;
    --muted: #7a7062;
    --line: #e4ddd0;
    --accent: #c0442a;
    --accent-soft: #f7e3dc;
    --blue: #2e6b9e;
    --blue-soft: #e3eef7;
    --green: #3a7d5c;
    --green-soft: #e1f0e7;
    --yellow: #e8b923;
    --yellow-soft: #fdf3d3;
    --shadow: 0 2px 10px rgba(44,36,22,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.55; min-height: 100vh; }

  .progress { position: fixed; top: 0; left: 0; height: 4px; background: var(--accent); transition: width .35s ease; z-index: 10; }

  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 28px 10px; flex-wrap: wrap;
  }
  .top a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
  .top a.back:hover { color: var(--accent); }
  .top h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 34px; line-height: 1.1; letter-spacing: -0.3px; }
  .top h1 em { color: var(--accent); }
  .top .sub { color: var(--muted); font-size: 14px; }

  main {
    display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(340px, 1fr);
    gap: 20px; padding: 10px 28px 28px; align-items: start;
  }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 600px) { main, header.top { padding-left: 16px; padding-right: 16px; } .top h1 { font-size: 28px; } }

  .mapcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 10px; position: sticky; top: 14px;
  }
  @media (max-width: 1100px) { .mapcard { position: static; } }
  .mapscroll { overflow-x: auto; }
  svg.vsm { display: block; width: 100%; min-width: 760px; height: auto; font-family: 'DM Sans', sans-serif; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 6px 2px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* SVG reveal + focus */
  svg.vsm [data-s] { opacity: 0; transition: opacity .45s ease; pointer-events: none; }
  svg.vsm [data-s].on { opacity: 1; }
  svg.vsm.focus [data-s].on:not(.hl) { opacity: .28; }
  svg.vsm .hl { filter: drop-shadow(0 0 5px rgba(192,68,42,.55)); }
  svg.vsm .band { opacity: 1 !important; }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 22px 24px 18px; display: flex; flex-direction: column; min-height: 420px;
  }
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .panel h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 30px; line-height: 1.15; margin: 4px 0 12px; }
  .body p { margin-bottom: 10px; }
  .body ul { margin: 0 0 10px 20px; }
  .body li { margin-bottom: 4px; }
  .body b { font-weight: 600; }
  .body a { color: var(--accent); }
  .calc {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #f4f0e8; border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 10px 14px; margin: 6px 0 12px; white-space: pre-wrap; line-height: 1.7;
  }
  .calc .ans { color: var(--accent); font-weight: 600; }
  .look, .ask { border-radius: 8px; padding: 10px 14px; margin: 4px 0 10px; font-size: 15px; }
  .look { background: var(--yellow-soft); }
  .ask { background: var(--blue-soft); }
  .look > b:first-child, .ask > b:first-child { display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
  .look > b:first-child { color: #8a6a00; } .ask > b:first-child { color: var(--blue); }
  .quote { font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1.25; color: var(--ink); margin: 6px 0 12px; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 14px; margin: 4px 0 12px; }
  table.mini th, table.mini td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; }
  table.mini th:first-child, table.mini td:first-child { text-align: left; }
  table.mini td { font-family: 'JetBrains Mono', monospace; }
  table.mini td:not(:first-child) { white-space: nowrap; }
  table.mini tr.total td { font-weight: 600; color: var(--accent); border-bottom: none; }

  .bars { margin: 6px 0 12px; }
  .bar { display: grid; grid-template-columns: 88px 1fr 54px; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 6px; }
  .bar .track { position: relative; height: 16px; background: #f1ece2; border-radius: 4px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 4px; }
  .bar .fill.hot { background: var(--accent); }
  .bar .takt { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .bar .v { font-family: 'JetBrains Mono', monospace; text-align: right; }

  details.q { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  details.q summary { cursor: pointer; font-weight: 500; }
  details.q div { margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 14px; }

  .nav { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
  .nav button {
    font: inherit; font-weight: 600; font-size: 15px; border-radius: 999px; padding: 9px 18px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .nav button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav .count { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); margin-left: auto; }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .dots button { width: 11px; height: 11px; border-radius: 50%; border: none; background: var(--line); cursor: pointer; padding: 0; }
  .dots button.done { background: #d9a596; }
  .dots button.cur { background: var(--accent); transform: scale(1.25); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

      </g>
      <g id="tri4" data-s="9">
        <polygon points="905,300 923,334 887,334" fill="#fdf3d3" stroke="#b8860b" stroke-width="1.6"/><text x="905" y="330" text-anchor="middle" font-size="13" font-weight="700">I</text>
        <text x="905" y="294" text-anchor="middle" font-size="12" font-weight="600">960</text>
      </g>

      <!-- Timeline -->
      <g id="timeline" data-s="11">
        <polyline points="20,548 145,548 145,598 275,598 275,548 345,548 345,598 475,598 475,548 545,548 545,598 675,598 675,548 745,548 745,598 875,598 875,548 935,548"
          fill="none" stroke="#2c2416" stroke-width="2.2"/>
        <g font-size="12.5" text-anchor="middle" font-weight="600">
          <text x="82" y="541">4 days</text><text x="310" y="541">1.75 d</text><text x="510" y="541">2.5 d</text><text x="710" y="541">1.25 d</text><text x="905" y="541">2.0 d</text>
        </g>
        <g font-size="12.5" text-anchor="middle" font-family="JetBrains Mono, monospace" fill="#3a7d5c">
          <text x="210" y="615">18 s</text><text x="410" y="615">40 s</text><text x="610" y="615">50 s</text><text x="810" y="615">15 s</text>
        </g>
      </g>
      <g id="summary" data-s="12">
        <rect x="948" y="530" width="142" height="76" rx="6" fill="#fff" stroke="#c0442a" stroke-width="1.6"/>
        <text x="958" y="550" font-size="11" fill="#7a7062">Production lead time</text>
        <text x="958" y="568" font-size="15" font-weight="700" fill="#c0442a">11.5 days</text>
        <text x="958" y="586" font-size="11" fill="#7a7062">Processing time</text>
        <text x="958" y="601" font-size="13" font-weight="700" fill="#3a7d5c">123 sec</text>
      </g>
      <g id="pce" data-s="13">
        <rect x="948" y="612" width="142" height="28" rx="6" fill="#c0442a"/>
        <text x="1019" y="631" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">PCE ≈ 0.04%</text>
      </g>

      <!-- Kaizen bursts (future state) -->
      <g id="kaizen" data-s="15">
        <g transform="translate(330,205)">
          <polygon points="0,-30 9,-12 28,-18 18,0 30,14 10,15 6,32 -6,16 -24,24 -18,6 -32,-4 -14,-12 -16,-30 -4,-16" fill="#c0442a" opacity=".92"/>
          <text y="-1" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Pull, not</text><text y="11" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">push</text>
        </g>
        <g transform="translate(40,232)">
          <polygon points="0,-28 9,-11 26,-17 17,0 28,13 9,14 6,30 -6,15 -23,22 -17,6 -30,-4 -13,-11 -15,-28 -4,-15" fill="#c0442a" opacity=".92"/>
          <text y="-1" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Daily</text><text y="11" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">flour</text>
        </g>
        <g transform="translate(510,445)">
          <polygon points="0,-22 8,-9 21,-13 14,0 23,10 8,11 5,24 -5,12 -19,18 -14,5 -24,-3 -10,-9 -12,-22 -3,-12" fill="#c0442a" opacity=".92"/>
          <text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Kanban</text>
        </g>
        <g transform="translate(710,445)">
          <polygon points="0,-22 8,-9 21,-13 14,0 23,10 8,11 5,24 -5,12 -19,18 -14,5 -24,-3 -10,-9 -12,-22 -3,-12" fill="#c0442a" opacity=".92"/>
          <text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Kanban</text>
        </g>
      </g>
    </svg>
    </div>
    <div class="legend">
      <span><svg width="26" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#2e6b9e" stroke-width="2"/></svg>manual info</span>
      <span><svg width="26" height="12"><path d="M0,6 L9,6 L12,1 L15,11 L18,6 L26,6" fill="none" stroke="#2e6b9e" stroke-width="2"/></svg>electronic info</span>
      <span><svg width="26" height="10"><rect x="0" y="2" width="24" height="6" fill="url(#stripes)"/></svg>push (material)</span>
      <span><svg width="18" height="16"><polygon points="9,1 17,15 1,15" fill="#fdf3d3" stroke="#b8860b"/></svg>inventory (WIP)</span>
      <span><svg width="26" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#2c2416" stroke-width="2.4"/></svg>shipment</span>
    </div>
  </section>

  <section class="panel" aria-live="polite">
    <div class="kicker" id="kicker"></div>
    <h2 id="title"></h2>
    <div class="body" id="body"></div>
    <div class="nav">
      <button id="prev">← Back</button>
      <button id="next" class="primary">Next →</button>
      <span class="count" id="count"></span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="hint">Tip: use ← → arrow keys.</div>
  </section>
</main>

<script>
(function () {
  var STEPS = [
    {
      k: "The case", t: "SunCrest has a bread problem",
      hl: [],
      b: `<p>SunCrest Bakery makes artisan bread for <b>Metro Fresh Grocers</b>. Metro Fresh is unhappy: orders take too long and the bread isn't fresh when it arrives.</p>
<p>SunCrest's managers want to spend <b>$500,000 on a faster oven</b>. They think baking is too slow.</p>
<div class="ask"><b>Before we decide</b>Would you sign that check? What would you want to know first?</div>
<p>A lean manager doesn't guess. They <b>map the flow</b>. A value stream map has three layers, shaded on the map:</p>
<ul><li><b>The Brain</b> (top): how information flows</li><li><b>The Body</b> (middle): how material flows</li><li><b>The Truth</b> (bottom): a timeline of work vs. waiting</li></ul>
<p>New to cycle time, lead time, and WIP? Start with the <a href="vsm-walkthrough-in-n-out.html">In-N-Out walkthrough</a>.</p>`
    },
    {
      k: "Layer 1 · The Brain", t: "Start with the customer",
      hl: ["customer", "custData"],
      b: `<p>We read a VSM starting at the <b>customer</b> (top right), because everything in the plant should be sized to what the customer needs.</p>
<p>The customer's data box tells us demand: <b>2,400 loaves per week</b> (800 sourdough + 1,600 wheat), shipped on racks of 30, over a 5-day week.</p>
<div class="calc">Daily demand = 2,400 loaves ÷ 5 days
             = <span class="ans">480 loaves/day</span></div>
<div class="look"><b>Remember this number</b>480 loaves/day drives two calculations later: takt time and how many days each pile of inventory represents.</div>`
    },
    {
      k: "Layer 1 · The Brain", t: "Then the supplier",
      hl: ["supplier", "supTruck"],
      b: `<p>The <b>supplier</b> sits top left. Heartland Flour Mill delivers 500 lb bags of flour.</p>
<p>The thick arrow is a <b>shipment</b>. The truck icon says how often: <b>once a week, on Tuesday</b>.</p>
<div class="ask"><b>Think</b>If flour only arrives once a week, what does SunCrest have to keep on hand?</div>
<div class="look"><b>What to look for</b>Infrequent deliveries force big raw-material stockpiles. Hold that thought for the inventory step.</div>`
    },
    {
      k: "Layer 1 · The Brain", t: "Production control: how the plant thinks",
      hl: ["pc", "infoIn", "infoOut"],
      b: `<p><b>Production Control</b> (top center) is the planning office. The thin blue arrows are <b>information</b>, not product.</p>
<ul><li><b>Straight line</b> = manual information (paper, fax, phone)</li><li><b>Zig-zag line</b> = electronic information (EDI, email, system)</li></ul>
<p>From the customer: a <b>daily order</b> (electronic) plus 90/60/30-day forecasts. To the supplier: a 6-week forecast plus a <b>weekly fax</b>.</p>
<div class="look"><b>What to look for</b>The customer talks to SunCrest every day. SunCrest talks to its supplier once a week, by fax. Information slows down as it moves upstream.</div>`
    },
    {
      k: "Layer 1 · The Brain", t: "The schedule tells the floor what to do",
      hl: ["sched", "ship"],
      b: `<p>Production Control sends a <b>weekly schedule</b> to every process: Mixing, Proofing, Baking, and Packaging each get their own copy. Shipping gets a daily ship schedule.</p>
<div class="ask"><b>Think</b>The customer orders daily. The floor is scheduled weekly, from forecasts. What happens when Tuesday's order doesn't match Monday's plan?</div>
<p>Each station keeps building to the weekly plan, whether or not the next step needs it. That's <b>overproduction</b>, the waste that creates all the others.</p>
<div class="look"><b>What to look for</b>Every station receiving its own schedule is a red flag for <b>push</b>. In a pull system, only one point gets the schedule and the rest respond to signals.</div>`
    },
    {
      k: "Layer 2 · The Body", t: "Process boxes and push arrows",
      hl: ["pMix", "pProof", "pBake", "pPack", "pShip", "push", "shipTruck"],
      b: `<p>The middle layer is the factory floor. Each <b>process box</b> is one area where the bread is worked on: <b>Mixing → Proofing → Baking → Packaging → Shipping</b>.</p>
<p>The striped arrows are <b>push arrows</b>. Each station makes product on its own schedule and pushes it to the next, ready or not.</p>
<p>Finished bread leaves by truck <b>once a day</b> to Metro Fresh.</p>
<div class="look"><b>What to look for</b>Count the push arrows. Every one is a place where inventory can pile up.</div>`
    },
    {
      k: "Layer 2 · The Body", t: "Reading a data box",
      hl: ["pMix", "dMix"],
      b: `<p>Under every process is a <b>data box</b>, the station's vital signs. Here's Mixing:</p>
<table class="mini"><tr><th>Field</th><th>Mixing</th></tr>
<tr><td>C/T: cycle time, work time per loaf</td><td>18 sec</td></tr>
<tr><td>C/O: changeover, time to switch products</td><td>12 min</td></tr>
<tr><td>Uptime: % of time the equipment runs</td><td>97%</td></tr>
<tr><td>Avail: working seconds per day</td><td>27,000</td></tr>
<tr><td>Shifts per day</td><td>1</td></tr></table>
<div class="calc">27,000 sec ÷ 3,600 = <span class="ans">7.5 hours</span> of work per shift</div>
<p>Changeover matters here because SunCrest makes <b>two products</b>. Every switch between sourdough and wheat costs dead time.</p>`
    },
    {
      k: "Layer 2 · The Body", t: "Compare the stations",
      hl: ["dProof", "dBake", "dPack", "dMix"],
      b: `<p>Now all four data boxes are filled in.</p>
<table class="mini"><tr><th></th><th>C/T</th><th>C/O</th><th>Uptime</th></tr>
<tr><td>Mixing</td><td>18 s</td><td>12 min</td><td>97%</td></tr>
<tr><td>Proofing</td><td>40 s</td><td>5 min</td><td>100%</td></tr>
<tr><td><b>Baking</b></td><td><b>50 s</b></td><td><b>20 min</b></td><td><b>95%</b></td></tr>
<tr><td>Packaging</td><td>15 s</td><td>8 min</td><td>100%</td></tr></table>
<div class="ask"><b>Think</b>Which station would you worry about?</div>
<p>Baking has the <b>longest cycle time</b>, the <b>longest changeover</b>, and the <b>lowest uptime</b>. It's the bottleneck candidate. But is it actually too slow? We need something to compare it to.</p>`
    },
    {
      k: "Layer 2 · The Body", t: "Takt time: the customer's heartbeat",
      hl: ["custData", "dBake", "pBake"],
      b: `<p><b>Takt time</b> is how often one loaf must be finished to keep up with demand. It's the pace the customer sets.</p>
<div class="calc">Takt = Available time per day ÷ Daily demand
     = 27,000 sec ÷ 480 loaves
     = <span class="ans">56.25 sec per loaf</span></div>
<div class="bars">
  <div class="bar"><span>Mixing</span><div class="track"><div class="fill" style="width:24%"></div><div class="takt" style="left:75%"></div></div><span class="v">18 s</span></div>
  <div class="bar"><span>Proofing</span><div class="track"><div class="fill" style="width:53.3%"></div><div class="takt" style="left:75%"></div></div><span class="v">40 s</span></div>
  <div class="bar"><span>Baking</span><div class="track"><div class="fill hot" style="width:66.7%"></div><div class="takt" style="left:75%"></div></div><span class="v">50 s</span></div>
  <div class="bar"><span>Packaging</span><div class="track"><div class="fill" style="width:20%"></div><div class="takt" style="left:75%"></div></div><span class="v">15 s</span></div>
  <div class="bar"><span style="font-weight:600">Takt</span><div class="track" style="background:none"><div class="takt" style="left:75%"></div></div><span class="v">56.25</span></div>
</div>
<p><b>Rule:</b> if a cycle time is <b>below</b> takt, that station can keep up. Every station here is below 56.25 s, so <b>the oven is fast enough</b>.</p>
<div class="look"><b>Closer look</b>Baking is the tightest at 50 ÷ 56.25 ≈ 89% of takt. With 95% uptime it can make 27,000 × 0.95 ÷ 50 = 513 loaves/day vs. 480 needed. That's tight, but it's enough.</div>`
    },
    {
      k: "Layer 2 · The Body", t: "The yellow triangles: inventory",
      hl: ["tri0", "tri1", "tri2", "tri3", "tri4"],
      b: `<p>Each <b>triangle</b> is a pile of inventory (WIP) waiting between steps. The number is how many loaves are sitting there right now.</p>
<table class="mini"><tr><th>Where</th><th>Pile</th></tr>
<tr><td>Raw flour before Mixing</td><td>4 days</td></tr>
<tr><td>Mixing → Proofing</td><td>840</td></tr>
<tr><td><b>Proofing → Baking</b></td><td><b>1,200</b></td></tr>
<tr><td>Baking → Packaging</td><td>600</td></tr>
<tr><td>Packaging → Shipping</td><td>960</td></tr></table>
<div class="ask"><b>Think</b>Where's the biggest pile? Why would it be right in front of the oven?</div>
<p>Dough piles up in front of the station with the longest changeover and the lowest uptime. This is the drive-thru line from In-N-Out, made of bread.</p>`
    },
    {
      k: "Converting WIP", t: "How long does a loaf wait in each pile?",
      hl: ["tri1"],
      b: `<p>A pile of loaves doesn't tell us much until we turn it into <b>time</b>. A new loaf joins the back of the line and waits until everything ahead of it is used up. The plant uses up <b>480 loaves a day</b>.</p>
<div class="calc">Wait (days) = WIP ÷ Daily demand

Mixing → Proofing:  840 ÷ 480 = <span class="ans">1.75 days</span></div>
<p>Same move for every pile:</p>
<table class="mini"><tr><th>Pile</th><th>WIP</th><th>÷ 480</th></tr>
<tr><td>Raw flour</td><td>given</td><td>4.00 d</td></tr>
<tr><td>Mixing → Proofing</td><td>840</td><td>1.75 d</td></tr>
<tr><td>Proofing → Baking</td><td>1,200</td><td>2.50 d</td></tr>
<tr><td>Baking → Packaging</td><td>600</td><td>1.25 d</td></tr>
<tr><td>Packaging → Shipping</td><td>960</td><td>2.00 d</td></tr></table>
<div class="look"><b>Common mistake</b>Divide by <b>daily</b> demand (480), not weekly (2,400). Weekly would make every wait look five times shorter.</div>`
    },
    {
      k: "Layer 3 · The Truth", t: "The staircase timeline",
      hl: ["timeline"],
      b: `<p>The bottom of the map is a <b>staircase</b>:</p>
<ul><li><b>High steps</b> sit under the triangles: waiting time, measured in <b>days</b></li><li><b>Low steps</b> sit under the process boxes: work time (cycle time), measured in <b>seconds</b></li></ul>
<p>Look at the units. Waiting is counted in days and work in seconds. That difference is the whole point of the map.</p>
<div class="quote">"The work happens in seconds. The waiting happens in days."</div>`
    },
    {
      k: "Layer 3 · The Truth", t: "Production lead time vs. processing time",
      hl: ["timeline", "summary"],
      b: `<p>Add up each row of the staircase.</p>
<div class="calc">Production lead time (top steps)
  = 4 + 1.75 + 2.5 + 1.25 + 2.0
  = <span class="ans">11.5 days</span>

Processing time (bottom steps)
  = 18 + 40 + 50 + 15
  = <span class="ans">123 seconds</span></div>
<p>A loaf spends about two minutes being worked on and <b>eleven and a half days</b> sitting in piles. That's why Metro Fresh's bread isn't fresh.</p>`
    },
    {
      k: "Layer 3 · The Truth", t: "Process cycle efficiency (PCE)",
      hl: ["summary", "pce"],
      b: `<p><b>PCE</b> asks: what share of the lead time is actual work? Put both numbers in the same unit first, using <b>working seconds</b> per day.</p>
<div class="calc">Lead time in seconds = 11.5 days × 27,000 sec/day
                     = 310,500 sec

PCE = Processing time ÷ Lead time
    = 123 ÷ 310,500
    = 0.000396
    ≈ <span class="ans">0.04%</span></div>
<p>More than <b>99.9%</b> of a loaf's time at SunCrest is waiting.</p>`
    },
    {
      k: "Diagnosis", t: "So, do we buy the $500K oven?",
      hl: ["tri2", "pBake", "dBake", "sched", "supTruck", "summary"],
      b: `<p>Look at what the map is telling us:</p>
<ul>
<li>The oven (50 s) is <b>already faster than takt</b> (56.25 s).</li>
<li>A faster oven saves a few <b>seconds</b> out of 123. The loaf still waits <b>11.5 days</b>.</li>
<li>The real problems are the piles, especially <b>2.5 days in front of the oven</b>, caused by a 20-min changeover and a weekly push schedule.</li>
<li>Weekly flour deliveries force <b>4 days</b> of raw stock.</li>
</ul>
<div class="quote">"Don't buy speed for the 123 seconds. Attack the 11.5 days."</div>
<div class="look"><b>The lean manager's checklist</b>Where are the biggest piles? Is any cycle time above takt? Who gets a schedule, and how often? How long are changeovers?</div>`
    },
    {
      k: "Future state", t: "What would lean do instead?",
      hl: ["kaizen"],
      b: `<p>The red <b>kaizen bursts</b> mark where to improve. Here's one possible future state (illustrative numbers):</p>
<ul>
<li><b>Daily flour</b> deliveries: raw stock drops from 4 days to 1</li>
<li><b>Pull, not push</b>: only Packaging gets the schedule, and upstream steps make bread when signaled</li>
<li><b>Kanban</b> loops cap each pile at 240 loaves, half a day of demand</li>
</ul>
<div class="calc">Future lead time = 1 + 0.5 + 0.5 + 0.5 + 0.5
                 = <span class="ans">3 days</span>   (was 11.5)
PCE = 123 ÷ (3 × 27,000) ≈ <span class="ans">0.15%</span></div>
<p>The bread arrives more than 8 days fresher, and SunCrest didn't buy an oven. How do you size those kanban loops? That's the <a href="kanban-walkthrough.html">Kanban walkthrough</a>.</p>`
    },
    {
      k: "Wrap-up", t: "Check yourself",
      hl: [],
      b: `<p>The whole map is back. Try these without scrolling back:</p>
<details class="q"><summary>1. Takt time if demand rose to 3,000 loaves/week?</summary><div>600/day → 27,000 ÷ 600 = 45 sec. Baking (50 s) is now above takt, so the oven becomes a real constraint.</div></details>
<details class="q"><summary>2. How many days is a pile of 1,440 loaves?</summary><div>1,440 ÷ 480 = 3 days</div></details>
<details class="q"><summary>3. If the 1,200-loaf pile shrank to 240, new lead time?</summary><div>4 + 1.75 + 0.5 + 1.25 + 2.0 = 9.5 days</div></details>
<details class="q"><summary>4. Which station has the most changeover time to attack first?</summary><div>Baking: 20 min (and the biggest pile sits in front of it)</div></details>
<div class="calc">Takt        = Available time ÷ Daily demand
Wait (days) = WIP ÷ Daily demand
Lead time   = Σ waits
Proc. time  = Σ cycle times
PCE         = Proc. time ÷ Lead time (same units)</div>`
    }
  ];

  var svg = document.getElementById("vsm");
  var els = Array.prototype.slice.call(svg.querySelectorAll("[data-s]"));
  var cur = 0;
  var $ = function (id) { return document.getElementById(id); };

  var dots = $("dots");
  STEPS.forEach(function (_, i) {
    var b = document.createElement("button");
    b.setAttribute("aria-label", "Go to step " + (i + 1));
    b.addEventListener("click", function () { go(i); });
    dots.appendChild(b);
  });

  function go(i) {
    cur = Math.max(0, Math.min(STEPS.length - 1, i));
    var s = STEPS[cur];
    var last = cur === STEPS.length - 1;
    var hl = last ? [] : s.hl;
    els.forEach(function (el) {
      var on = cur >= +el.getAttribute("data-s");
      if (el.id === "kaizen") on = cur === 15;
      el.classList.toggle("on", on);
      el.classList.toggle("hl", hl.indexOf(el.id) > -1);
    });
    svg.classList.toggle("focus", hl.length > 0);
    $("kicker").textContent = "Step " + (cur + 1) + " · " + s.k;
    $("title").textContent = s.t;
    $("body").innerHTML = s.b;
    $("count").textContent = (cur + 1) + " / " + STEPS.length;
    $("prev").disabled = cur === 0;
    $("next").disabled = last;
    $("progress").style.width = ((cur + 1) / STEPS.length * 100) + "%";
    Array.prototype.forEach.call(dots.children, function (d, j) {
      d.className = j === cur ? "cur" : (j < cur ? "done" : "");
    });
    try { history.replaceState(null, "", "#step-" + (cur + 1)); } catch (e) {}
  }

  $("prev").addEventListener("click", function () { go(cur - 1); });
  $("next").addEventListener("click", function () { go(cur + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "SUMMARY")) return;
    if (e.key === "ArrowRight") go(cur + 1);
    if (e.key === "ArrowLeft") go(cur - 1);
  });

  var m = /step-(\d+)/.exec(location.hash);
  go(m ? (+m[1] - 1) : 0);
})();
</script>
